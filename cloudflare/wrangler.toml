# enquiry form handler.
name = "rian-cullet"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

# Uncomment after creating the namespace (see cloudflare/README.md):
# [[kv_namespaces]]
# binding = "ENQUIRIES"
# id = "<your-kv-namespace-id>"
